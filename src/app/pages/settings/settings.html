<section class="page">
  <div class="sub-header-container">
    <app-sub-header title="Zum Dashboard" subHeaderPath="/dashboard" iconName="arrow_back"></app-sub-header>
  </div>

  <h1>Einstellungen</h1>

  <section class="settings-card" aria-labelledby="backup-heading">
    <h2 id="backup-heading">Datensicherung</h2>
    <p>Exportiere alle Einträge als JSON-Datei oder stelle sie aus einer Sicherung wieder her. Beim Import werden die aktuellen Einträge ersetzt.</p>
    <div class="settings-actions">
      <app-button-components label="Backup exportieren" iconName="download" (buttonClick)="exportBackup()" />
      <app-button-components label="Backup importieren" iconName="upload" (buttonClick)="importInput.click()" />
      <input #importInput type="file" accept="application/json,.json" hidden (change)="importBackup($event)">
    </div>
    @if (backupMessage()) {
    <p [class.backup-error]="backupIsError()" [attr.role]="backupIsError() ? 'alert' : 'status'">{{ backupMessage() }}</p>
    }
  </section>
</section>
