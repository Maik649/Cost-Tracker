<section>
  <h1>Login</h1>
  <form (ngSubmit)="onSubmit()">
    <p *ngIf="!valid()" [innerText]="invalidMessage()"></p>
    <label for="email">Email:</label>
    <input type="email" id="email" name="email" ngModel [ngModel]="email()">
    <label for="password">Password:</label>
    <input type="password" id="password" name="password" ngModel [ngModel]="password()">
    <button type="submit" class="primary-btn">Login</button>
  </form>
</section>
