<mat-drawer-container class="dashboard-container">
  <mat-drawer #drawer mode="side" [opened]="false">
    <div class="dashboard-nav-header">
      <h3 class="dashboard-nav-title">Navigation</h3>
    </div>
  </mat-drawer>
  <mat-drawer-content>
    <!-- <button mat-icon-button aria-label="Menü öffnen oder schließen" (click)="drawer.toggle()">
      @if (drawer.opened) {
        <mat-icon>close</mat-icon>
        } @else {
          <mat-icon>menu</mat-icon>
          }
          
        </button> -->
    @if(auth.isAuthenticated()){
      <mat-toolbar class="background-gradient" >
      <div class="sub-header-content-wrapper"> 
        <img class="logo-image" src="../assets/CT-logo-new.webp" alt="Cost Tracker Logo">
      <span class="dashboard-nav-title">Dashboard</span>
      <span class="spacer"></span>
      <nav class="dashboard-nav" aria-label="Hauptnavigation">
        <span class="user-badge"
          [attr.title]="auth.currentUser()?.email ?? 'Gast'"
          [attr.aria-label]="auth.isGuest() ? 'Gast' : 'Angemeldet als ' + (auth.currentUser()?.email ?? '')">
          {{ auth.headerUserLabel() }}
        </span>
        <a class="button-gradient" routerLink="/settings"> <mat-icon>settings</mat-icon>Settings</a>
        <a class="button-gradient" (click)="logout()"> <mat-icon>logout</mat-icon>Logout</a>
      </nav>
    </div>
    </mat-toolbar>
    <section class="dashboard-section background-gradient">
      <div class="dashboard-buttons">
        <app-button-components *ngFor="let button of buttons" class="button-gradient" [routerLink]="button.routerLink"
          [label]="button.label">
        </app-button-components>
      </div>
    </section>
    }
  </mat-drawer-content>
</mat-drawer-container>
