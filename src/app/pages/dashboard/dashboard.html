<mat-drawer-container class="dashboard-container">
  <mat-drawer #drawer mode="side" [opened]="false">
    <div class="dashboard-nav-header">
      <h3 class="dashboard-nav-title">Navigation</h3>
    </div>
  </mat-drawer>
  <mat-drawer-content>
    <!-- <button mat-icon-button aria-label="Menü öffnen oder schließen" (click)="drawer.toggle()">
      @if (drawer.opened) {
        <mat-icon>close</mat-icon>
        } @else {
          <mat-icon>menu</mat-icon>
          }
          
        </button> -->
        @if(auth.isAuthenticated()){
          <span>Dashboard</span>
          <mat-toolbar color="primary">
        <span class="spacer"></span>
        <nav class="dashboard-nav" aria-label="Hauptnavigation">
          <a class="secondary-btn" routerLink="/settings"> <mat-icon>settings</mat-icon>Settings</a>
          <button type="button" class="secondary-btn" (click)="logout()"> <mat-icon>logout</mat-icon>Logout</button>
        </nav>
      </mat-toolbar>
        <section class="dashboard-section">
          <div class="dashboard-buttons">
            <app-button-components
          *ngFor="let button of buttons"
          class="dashboard-button"
          [routerLink]="button.routerLink"
          [label]="button.label">
        </app-button-components>
      </div>
    </section>
    }@else {
        <span>Bitte einloggen</span>
        <a routerLink="/">Login</a>
      }

    
  </mat-drawer-content>
</mat-drawer-container>
